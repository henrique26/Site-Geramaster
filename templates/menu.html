<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #000000, #330000);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .logo {
      display: block;
      max-width: 200px;
      margin: 20px auto;
    }

    .btn-primary {
      background-color: #e60000;
      border: none;
      transition: transform 0.2s ease-in-out;
    }

    .btn-primary:hover {
      background-color: #990000;
      transform: scale(1.05);
    }

    .btn-secondary {
      background-color: #555;
      border: none;
    }

    .btn-secondary:hover {
      background-color: #333;
      transform: scale(1.05);
    }

    .btn-success {
      background-color: #28a745;
      border: none;
    }

    .btn-success:hover {
      background-color: #218838;
      transform: scale(1.05);
    }

    .btn-light {
      background-color: #D3D3D3;
      border: none;
    }
    .btn-light:hover {
      background-color: #A9A9A9;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <img src="/static/Geramaster Logo Brando e Vermelho Geramaster fundo transparente.png" alt="Logo Geramaster" class="logo" style="max-width: 350px;">

{% if alertas %}
  <div class="alert alert-warning" style="margin: 20px;">
    <strong>Alerta! Baixo RDV!</strong><br>
    {% for usuario in alertas %}
    • {{ usuario[0] }} está com saldo de R$ {{ '%.2f'|format(usuario[1]|float) }}<br>
    {% endfor %}
  </div>
{% endif %}

  <div class="container text-center">
    <h1 class="my-4">Olá, {{ usuario }}!</h1>
    <a href="{{ url_for('logout') }}" class="btn btn-danger mb-4">Sair</a>

    <div class="d-grid gap-3 col-12 col-sm-8 col-md-6 mx-auto">
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg">Folha de Ponto</a>
      <a href="{{ url_for('rdv') }}" class="btn btn-secondary btn-lg">RDV</a>
      <a href="{{ url_for('deposito') }}" class="btn btn-success btn-lg">Registrar Depósito</a>
      <a href="{{ url_for('pendencias') }}" class="btn btn-light btn-lg">Pendências de OS</a>
      <!-- <a href="{{ url_for('controle_veiculos') }}" class="btn btn-light btn-lg">Controle Veículos</a> -->
    </div>
  </div>

</body>
</html>

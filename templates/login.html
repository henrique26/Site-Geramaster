<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Geramaster</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png">
  <meta name="theme-color" content="#0d6efd">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #000000, #330000);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
      padding: 30px;
      width: 100%;
      max-width: 400px;
    }

    .btn-primary {
      background-color: #e60000;
      border: none;
      transition: transform 0.2s ease-in-out;
    }

    .btn-primary:hover {
      background-color: #990000;
      transform: scale(1.05);
    }

    .form-label {
      color: #fff;
    }

    .form-control {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
    }

    .form-control::placeholder {
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>

<body>

  <div class="login-box">
    <div class="text-center mb-3">
      <img src="/static/Geramaster Logo Brando e Vermelho Geramaster fundo transparente.png" alt="Logo Geramaster" style="max-width: 350px;">
    </div>

    {% if erro %}
      <div class="alert alert-danger text-center">{{ erro }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label for="usuario" class="form-label">Usuário</label>
        <input type="text" name="usuario" id="usuario" class="form-control" required placeholder="Digite seu usuário">
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" name="senha" id="senha" class="form-control" required placeholder="Digite sua senha">
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js')
        .then(reg => console.log('Service Worker registrado!', reg))
        .catch(err => console.error('Erro ao registrar SW:', err));
    }
  </script>
</body>
</html>
